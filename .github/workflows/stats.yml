name: Update GitHub stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >
            show_icons=true&
            hide_border=true&
            bg_color=0d0814&
            title_color=ec4899&
            text_color=e9d5ff&
            icon_color=8b5cf6&
            ring_color=ec4899&
            hide_rank=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >
            layout=compact&
            langs_count=8&
            size_weight=0.5&
            count_weight=0.5&
            hide=HTML,CSS&
            hide_border=true&
            bg_color=0d0814&
            title_color=ec4899&
            text_color=e9d5ff
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats.svg assets/top-langs.svg
          git commit -m "chore: update profile stats" || exit 0
          git push